<div id="background">
    <p id="title">
        Escolha um livro:
    </p>

    <div id="books">
        @for (book of books(); track book.id){
            <div id="book">
                <p>
                    {{ book.title }}
                </p>
                <img src="/icons/book.png" alt="Book Icon" />
            </div>
        }
    </div>
</div>
